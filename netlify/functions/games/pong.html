<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080b10">
<title>Pong</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  background:radial-gradient(circle at center,#202938 0%,#0b0f16 65%,#05070b 100%);
  font-family:Arial,Helvetica,sans-serif;color:white;
  user-select:none;touch-action:none;
}
.game-wrapper{position:fixed;inset:0;width:100vw;height:100dvh;display:flex;justify-content:center;align-items:center}
#game-container{
  position:relative;width:100vw;height:100dvh;overflow:hidden;
  background:#101720;border:clamp(0px,.2vw,4px) solid rgba(255,255,255,.16);
  border-radius:clamp(0px,1.2vw,25px);
  box-shadow:0 25px 80px rgba(0,0,0,.55),inset 0 0 50px rgba(0,0,0,.35)
}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{
  position:absolute;top:clamp(15px,3vh,35px);left:0;width:100%;
  display:flex;justify-content:center;gap:clamp(45px,7vw,110px);
  pointer-events:none;z-index:5
}
.stat{display:flex;flex-direction:column;align-items:center;text-shadow:0 3px 6px rgba(0,0,0,.5)}
.stat span{font-size:clamp(10px,1vw,17px);font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.75)}
.stat strong{font-size:clamp(32px,4vw,72px);line-height:1;margin-top:3px;font-weight:1000}
.overlay{
  position:absolute;inset:0;display:flex;justify-content:center;align-items:center;
  padding:20px;background:rgba(0,0,0,.32);backdrop-filter:blur(7px);z-index:10
}
.hidden{display:none!important}
.panel{
  width:min(90%,480px);padding:clamp(25px,4vw,45px);border-radius:28px;
  border:2px solid rgba(255,255,255,.15);
  background:linear-gradient(145deg,rgba(31,40,54,.97),rgba(8,12,19,.97));
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  text-align:center
}
.logo{
  font-size:clamp(48px,8vw,86px);font-weight:1000;letter-spacing:8px;
  margin:0 0 3px;text-shadow:0 8px 25px rgba(255,255,255,.15)
}
.logo-mark{font-size:clamp(32px,5vw,55px);margin-bottom:8px;opacity:.9}
h1,h2{margin:0 0 10px;font-weight:1000;letter-spacing:2px}
h2{font-size:clamp(20px,3vw,30px)}
.subtitle{margin:0 0 24px;color:rgba(255,255,255,.58);font-size:14px;line-height:1.5}
.section-title{margin:18px 0 10px;color:rgba(255,255,255,.55);font-size:11px;letter-spacing:2px;font-weight:900}
.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{
  width:100%;border:0;border-radius:14px;padding:clamp(13px,1.5vw,19px);
  font-size:clamp(14px,1.5vw,19px);font-weight:900;color:#10151d;
  background:linear-gradient(135deg,#fff,#cfd6df);cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.3);transition:transform .15s,box-shadow .15s
}
button:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(0,0,0,.4)}
button:active{transform:translateY(1px) scale(.97)}
button.active{outline:2px solid rgba(255,255,255,.8);background:#fff}
.secondary-button{margin-top:10px;color:white;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.difficulty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.difficulty-grid button{padding:11px 5px;font-size:12px}
#difficultyText{min-height:20px;margin:10px 0 17px;color:rgba(255,255,255,.5);font-size:12px}
.start{margin-top:4px}
.visible-controls{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:16px;padding:12px 14px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
  font-size:11px;font-weight:900;letter-spacing:1.5px;color:rgba(255,255,255,.65)
}
.toggle{
  width:65px;padding:8px 12px;margin:0;border-radius:10px;
  font-size:11px;color:#10151d;background:#fff;box-shadow:none
}
.toggle.off{color:#fff;background:rgba(255,255,255,.08)}
.controls{margin-top:18px;color:rgba(255,255,255,.38);font-size:10px;font-weight:900;letter-spacing:1px}
.results{display:flex;justify-content:center;gap:clamp(35px,6vw,75px);margin:25px 0}
.results div{display:flex;flex-direction:column;align-items:center}
.results span{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.45)}
.results strong{margin-top:5px;font-size:clamp(32px,4vw,55px)}
#directionText{font-size:clamp(28px,5vw,60px);font-weight:1000;letter-spacing:6px}
#directionArrow{font-size:clamp(70px,13vw,130px);margin:8px 0;filter:drop-shadow(0 0 20px rgba(255,255,255,.25))}

/* SLIDERS EN PANTALLA */
#mobile-controls {
  position:absolute;inset:0;z-index:7;pointer-events:none;
}
.slider-container {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 100px;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: auto;
}
#p1-container { left: 0; }
#p2-container { right: 0; }

.paddle-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 60vh;
  height: 24px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  outline: none;
  transform: rotate(90deg); /* 0 arriba, 1000 abajo */
  box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
  margin: 0;
}
.paddle-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 15px rgba(255,255,255,0.4), inset 0 0 5px rgba(0,0,0,0.2);
  cursor: pointer;
  transition: transform 0.1s ease;
}
.paddle-slider::-webkit-slider-thumb:active {
  transform: scale(1.15);
}

@media (max-width:700px){
  #game-container{width:100%;height:100%;border-radius:18px}
  .panel{padding:28px 22px}
  .difficulty-grid{grid-template-columns:1fr 1fr}
  .paddle-slider::-webkit-slider-thumb { width: 55px; height: 55px; } /* Más grande en móvil */
}
@media (orientation:landscape) and (max-width:900px){
  .panel{padding:18px 25px}
  .logo{font-size:45px}.logo-mark{font-size:28px}
  .subtitle{margin-bottom:12px}.section-title{margin:10px 0 7px}
  .controls{margin-top:10px}
}
</style>
</head>

<body>
<div class="game-wrapper">
<div id="game-container">
<canvas id="gameCanvas" width="1200" height="700"></canvas>

<div id="hud">
  <div class="stat"><span>PLAYER 1</span><strong id="score1">0</strong></div>
  <div class="stat"><span>PLAYER 2</span><strong id="score2">0</strong></div>
</div>

<div id="menu" class="overlay">
  <div class="panel">
    <div class="logo-mark">◐</div>
    <div class="logo">PONG</div>
    <div class="subtitle">Classic arcade • modern edition</div>

    <div id="mode-section">
      <div class="section-title">GAME MODE</div>
      <div class="button-grid">
        <button id="onePlayer">1 PLAYER</button>
        <button id="twoPlayers">2 PLAYERS</button>
      </div>
      <div class="visible-controls">
        <span>VISIBLE CONTROLS</span>
        <button id="controlsToggle" class="toggle">ON</button>
      </div>
    </div>

    <div id="difficulty-section" class="hidden">
      <div class="section-title">DIFFICULTY</div>
      <div class="difficulty-grid">
        <button data-difficulty="1">EASY</button>
        <button data-difficulty="2" class="active">NORMAL</button>
        <button data-difficulty="3">HARD</button>
        <button data-difficulty="4">INSANE</button>
      </div>
      <div id="difficultyText">Balanced acceleration and reactive bot</div>
      <button id="startButton" class="start">START GAME</button>
      <button id="backButton" class="secondary-button">BACK</button>
    </div>

    <div class="controls">P1: W / S &nbsp; • &nbsp; P2: ↑ / ↓</div>
  </div>
</div>

<div id="directionScreen" class="overlay hidden">
  <div class="panel">
    <div id="directionText">READY</div>
    <div id="directionArrow">➤</div>
    <div class="subtitle">BALL DIRECTION</div>
  </div>
</div>

<div id="gameOver" class="overlay hidden">
  <div class="panel">
    <h2 id="winner">PLAYER 1 WINS</h2>
    <div class="results">
      <div><span>PLAYER 1</span><strong id="final1">0</strong></div>
      <div><span>PLAYER 2</span><strong id="final2">0</strong></div>
    </div>
    <button id="againButton">PLAY AGAIN</button>
    <button id="menuButton" class="secondary-button">MAIN MENU</button>
  </div>
</div>

<!-- SLIDERS -->
<div id="mobile-controls">
  <div id="p1-container" class="slider-container">
    <input type="range" id="p1-slider" class="paddle-slider" min="0" max="1000" value="500">
  </div>
  <div id="p2-container" class="slider-container">
    <input type="range" id="p2-slider" class="paddle-slider" min="0" max="1000" value="500">
  </div>
</div>

</div>
</div>

<script>
const canvas=document.getElementById("gameCanvas"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const menu=document.getElementById("menu"),directionScreen=document.getElementById("directionScreen"),gameOver=document.getElementById("gameOver");
const modeSection=document.getElementById("mode-section"),difficultySection=document.getElementById("difficulty-section");
const difficultyText=document.getElementById("difficultyText"),directionArrow=document.getElementById("directionArrow");
const score1=document.getElementById("score1"),score2=document.getElementById("score2");
const final1=document.getElementById("final1"),final2=document.getElementById("final2"),winner=document.getElementById("winner");

const p1Slider = document.getElementById("p1-slider");
const p2Slider = document.getElementById("p2-slider");

const settings={
  1:{startSpeed:300,maxSpeed:560,acceleration:.32,playerSpeed:720,botSpeed:190,reaction:.28,deadZone:38},
  2:{startSpeed:350,maxSpeed:680,acceleration:.34,playerSpeed:730,botSpeed:330,reaction:.16,deadZone:25},
  3:{startSpeed:390,maxSpeed:800,acceleration:.38,playerSpeed:750,botSpeed:410,reaction:.08,deadZone:13},
  4:{startSpeed:420,maxSpeed:880,acceleration:.42,playerSpeed:790,botSpeed:550,reaction:.035,deadZone:5}
};

let difficulty=2,mode=2,running=false,selectingDirection=false;
let directionStart=0,lastTime=0,animationFrame=0,bounces=0,botReactionTimer=0,botDirection=0;
const keys={};
let p1Dragging = false, p2Dragging = false;

const player1={x:55,y:H/2-75,width:22,height:150,speed:730,score:0};
const player2={x:W-77,y:H/2-75,width:22,height:150,speed:570,score:0};
const ball={x:W/2,y:H/2,radius:15,angle:0,speed:350};

// Gestión de toques en Sliders
p1Slider.addEventListener("pointerdown", () => p1Dragging = true);
p1Slider.addEventListener("pointerup", () => p1Dragging = false);
p1Slider.addEventListener("pointercancel", () => p1Dragging = false);

p2Slider.addEventListener("pointerdown", () => p2Dragging = true);
p2Slider.addEventListener("pointerup", () => p2Dragging = false);
p2Slider.addEventListener("pointercancel", () => p2Dragging = false);

// Respaldo global por si sueltan el ratón fuera del slider
window.addEventListener("pointerup", () => { p1Dragging = false; p2Dragging = false; });

function randomAngle(){
  let a;
  do{a=Math.random()*Math.PI*2}while(Math.abs(Math.sin(a))<.25);
  return a;
}
function resetRound(direction=null){
  const c=settings[difficulty];
  ball.x=W/2;ball.y=H/2;ball.speed=c.startSpeed;bounces=0;botReactionTimer=0;botDirection=0;
  if(direction===1) ball.angle=Math.random()*.9-.45;
  else if(direction===-1) ball.angle=Math.PI+(Math.random()*.9-.45);
  else ball.angle=randomAngle();
  player1.y=H/2-player1.height/2;player2.y=H/2-player2.height/2;
  player1.speed=c.playerSpeed;player2.speed=c.botSpeed;updateScore();
}
function updateScore(){score1.textContent=player1.score;score2.textContent=player2.score}
function movePlayer(p,d,dt){
  p.y+=d*p.speed*dt;p.y=Math.max(0,Math.min(H-p.height,p.y));
}
function updatePlayer1(dt){
  if (p1Dragging) {
    player1.y = (p1Slider.value / 1000) * (H - player1.height);
  } else {
    let d=0;if(keys.w)d--;if(keys.s)d++;
    movePlayer(player1,d,dt);
    p1Slider.value = (player1.y / (H - player1.height)) * 1000;
  }
}
function updatePlayer2(dt){
  if(mode===1){
    updateBot(dt);
    p2Slider.value = (player2.y / (H - player2.height)) * 1000;
    return;
  }
  if (p2Dragging) {
    player2.y = (p2Slider.value / 1000) * (H - player2.height);
  } else {
    let d=0;if(keys.arrowup)d--;if(keys.arrowdown)d++;
    movePlayer(player2,d,dt);
    p2Slider.value = (player2.y / (H - player2.height)) * 1000;
  }
}
function updateBot(dt){
  const c=settings[difficulty],coming=Math.cos(ball.angle)>0;
  if(!coming){
    const diff=H/2-(player2.y+player2.height/2);botDirection=Math.abs(diff)>8?Math.sign(diff):0;
    movePlayer({get y(){return player2.y},set y(v){player2.y=v},speed:c.botSpeed,height:player2.height},botDirection,.35*dt);return;
  }
  botReactionTimer-=dt;
  if(botReactionTimer>0){player2.y+=botDirection*c.botSpeed*dt;player2.y=Math.max(0,Math.min(H-player2.height,player2.y));return}
  botReactionTimer=c.reaction;
  const diff=ball.y-(player2.y+player2.height/2);
  botDirection=Math.abs(diff)<=c.deadZone?0:Math.sign(diff);
  player2.y+=botDirection*c.botSpeed*dt;player2.y=Math.max(0,Math.min(H-player2.height,player2.y));
}
function increaseSpeed(){
  const c=settings[difficulty];bounces++;
  const growth=1-Math.exp(-c.acceleration*bounces);
  ball.speed=c.startSpeed+(c.maxSpeed-c.startSpeed)*growth;
}
function collide(p,left){
  const cx=Math.max(p.x,Math.min(ball.x,p.x+p.width)),cy=Math.max(p.y,Math.min(ball.y,p.y+p.height));
  const dx=ball.x-cx,dy=ball.y-cy;
  if(dx*dx+dy*dy>ball.radius*ball.radius)return;
  const vx=Math.cos(ball.angle),toward=left?vx<0:vx>0;if(!toward)return;
  const rel=Math.max(-1,Math.min(1,(ball.y-(p.y+p.height/2))/(p.height/2)));
  increaseSpeed();
  const bounce=rel*Math.PI/3;
  ball.angle=left?bounce:Math.PI-bounce;
  ball.x=left?p.x+p.width+ball.radius+1:p.x-ball.radius-1;
  botReactionTimer=0;
}
function updateBall(dt){
  ball.x+=Math.cos(ball.angle)*ball.speed*dt;ball.y+=Math.sin(ball.angle)*ball.speed*dt;
  if(ball.y-ball.radius<=0){ball.y=ball.radius;ball.angle=-ball.angle;increaseSpeed()}
  if(ball.y+ball.radius>=H){ball.y=H-ball.radius;ball.angle=-ball.angle;increaseSpeed()}
  collide(player1,true);collide(player2,false);
  if(ball.x+ball.radius<0){player2.score++;updateScore();if(player2.score>=7)return finishGame(mode===1?"BOT WINS":"PLAYER 2 WINS");prepareNextRound(1)}
  if(ball.x-ball.radius>W){player1.score++;updateScore();if(player1.score>=7)return finishGame("PLAYER 1 WINS");prepareNextRound(-1)}
}
function prepareNextRound(dir){
  running=false;selectingDirection=true;resetRound(dir);directionStart=performance.now();
  directionScreen.classList.remove("hidden");animationFrame=requestAnimationFrame(directionLoop);
}
function startRound(){
  player1.score=0;player2.score=0;updateScore();menu.classList.add("hidden");gameOver.classList.add("hidden");
  directionScreen.classList.remove("hidden");selectingDirection=true;running=false;resetRound();
  directionStart=performance.now();cancelAnimationFrame(animationFrame);animationFrame=requestAnimationFrame(directionLoop);
}
function finishGame(text){
  running=false;selectingDirection=false;winner.textContent=text;final1.textContent=player1.score;final2.textContent=player2.score;gameOver.classList.remove("hidden");
}
function directionLoop(time){
  if(!selectingDirection)return;
  const progress=Math.min((time-directionStart)/1800,1),eased=1-Math.pow(1-progress,3);
  const angle=ball.angle-Math.PI*2+Math.PI*2*eased;directionArrow.style.transform=`rotate(${angle}rad)`;draw();
  if(progress<1)animationFrame=requestAnimationFrame(directionLoop);
  else{directionArrow.style.transform=`rotate(${ball.angle}rad)`;selectingDirection=false;directionScreen.classList.add("hidden");running=true;lastTime=performance.now();animationFrame=requestAnimationFrame(gameLoop)}
}
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#111820");g.addColorStop(.5,"#080d14");g.addColorStop(1,"#03060a");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="rgba(255,255,255,.025)";ctx.lineWidth=1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
}
function drawCenter(){
  ctx.fillStyle="rgba(255,255,255,.2)";
  for(let y=20;y<H;y+=40)ctx.fillRect(W/2-2,y,4,22);
}
function drawPaddle(p){
  const g=ctx.createLinearGradient(p.x,0,p.x+p.width,0);g.addColorStop(0,"#fff");g.addColorStop(.5,"#ddd");g.addColorStop(1,"#888");
  ctx.fillStyle=g;ctx.shadowColor="rgba(255,255,255,.45)";ctx.shadowBlur=18;ctx.beginPath();ctx.roundRect(p.x,p.y,p.width,p.height,9);ctx.fill();ctx.shadowBlur=0;
}
function drawBall(){
  ctx.save();ctx.shadowColor="rgba(255,255,255,.8)";ctx.shadowBlur=22;
  const g=ctx.createRadialGradient(ball.x-5,ball.y-5,2,ball.x,ball.y,ball.radius);
  g.addColorStop(0,"#fff");g.addColorStop(.65,"#e8e8e8");g.addColorStop(1,"#777");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);ctx.fill();ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);drawBackground();drawCenter();drawPaddle(player1);drawPaddle(player2);drawBall()}
function gameLoop(time){
  if(!running){draw();return}
  let dt=Math.min((time-lastTime)/1000,.05);lastTime=time;
  updatePlayer1(dt);updatePlayer2(dt);updateBall(dt);draw();animationFrame=requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if([" ","ArrowUp","ArrowDown"].includes(e.key))e.preventDefault()});
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

const controlsToggle=document.getElementById("controlsToggle");
const mobileControls=document.getElementById("mobile-controls");
let visibleControls=true;

function updateControlsVisibility(){
  mobileControls.style.display=visibleControls?"block":"none";
  document.getElementById("p2-container").style.display=(mode===1)?"none":"flex";
  controlsToggle.textContent=visibleControls?"ON":"OFF";
  controlsToggle.classList.toggle("off",!visibleControls);
}

controlsToggle.addEventListener("click",e=>{
  e.stopPropagation();
  visibleControls=!visibleControls;
  updateControlsVisibility();
});

document.getElementById("onePlayer").onclick=()=>{
  mode=1;
  updateControlsVisibility();
  modeSection.classList.add("hidden");
  difficultySection.classList.remove("hidden");
};
document.getElementById("twoPlayers").onclick=()=>{
  mode=2;
  updateControlsVisibility();
  modeSection.classList.add("hidden");
  difficultySection.classList.remove("hidden");
};
document.querySelectorAll("[data-difficulty]").forEach(b=>b.onclick=()=>{
  difficulty=Number(b.dataset.difficulty);document.querySelectorAll("[data-difficulty]").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  difficultyText.textContent={1:"Slow and forgiving bot",2:"Balanced acceleration and reactive bot",3:"Fast acceleration and fast bot",4:"Extreme speed and extremely fast bot"}[difficulty];
});
document.getElementById("startButton").onclick=startRound;
document.getElementById("againButton").onclick=startRound;
document.getElementById("backButton").onclick=()=>{difficultySection.classList.add("hidden");modeSection.classList.remove("hidden")};
document.getElementById("menuButton").onclick=()=>{running=false;selectingDirection=false;menu.classList.remove("hidden");modeSection.classList.remove("hidden");difficultySection.classList.add("hidden");gameOver.classList.add("hidden");directionScreen.classList.add("hidden")};

updateControlsVisibility();
resetRound();draw();
</script>
</body>
</html>
