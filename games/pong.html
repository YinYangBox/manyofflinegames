<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080b10">
<title>Pong</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at center, #252525 0%, #0d0d0d 55%, #030303 100%);
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  user-select: none;
  touch-action: none;
}

#game-container {
  position: relative;
  width: min(96vw, calc(96vh * 1.714));
  height: min(96vh, calc(96vw / 1.714));
  border: 4px solid rgba(255, 255, 255, 0.9);
  border-radius: 26px;
  overflow: hidden;
  background: #050505;
  box-shadow:
    0 25px 80px rgba(0, 0, 0, 0.65),
    0 0 0 2px rgba(255, 255, 255, 0.08),
    inset 0 0 50px rgba(255, 255, 255, 0.04);
}

#gameCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#hud {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 35px;
  z-index: 5;
  pointer-events: none;
}

.hud-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 10px 16px;
  border: 2px solid rgba(255, 255, 255, 0.62);
  border-radius: 14px;
  background: rgba(8, 8, 8, 0.74);
  backdrop-filter: blur(4px);
  text-shadow: 3px 3px 0 #000, 0 0 16px rgba(255, 255, 255, 0.16);
}

.hud-label {
  color: #888;
  font-size: 9px;
  letter-spacing: 2px;
  font-weight: 900;
}

.hud-value {
  font-size: 20px;
  font-weight: 900;
  line-height: 1;
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(5px);
  padding: 20px;
}

.hidden {
  display: none !important;
}

.card {
  width: min(520px, 88%);
  padding: 38px;
  border: 2px solid rgba(255, 255, 255, 0.85);
  border-radius: 24px;
  background: linear-gradient(145deg, rgba(40, 40, 40, 0.98), rgba(15, 15, 15, 0.98));
  box-shadow:
    0 25px 70px rgba(0, 0, 0, 0.7),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
  text-align: center;
}

.logo {
  margin-bottom: 30px;
  font-size: clamp(50px, 9vw, 85px);
  font-weight: 900;
  letter-spacing: 12px;
  text-shadow: 4px 4px 0 #444, 0 0 25px rgba(255, 255, 255, 0.2);
}

h2 {
  margin: 0 0 18px;
  font-size: 22px;
  text-transform: uppercase;
  letter-spacing: 3px;
  font-weight: 900;
}

.subtitle {
  margin: 0 0 24px;
  color: #888;
  font-size: 14px;
  line-height: 1.6;
}

.section-title {
  margin: 18px 0 10px;
  color: rgba(255, 255, 255, 0.55);
  font-size: 11px;
  letter-spacing: 2px;
  font-weight: 900;
}

.button-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  border: 2px solid white;
  border-radius: 12px;
  padding: 14px 24px;
  background: #111;
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.12s, background 0.12s, color 0.12s;
}

button:hover {
  background: white;
  color: black;
  transform: translateY(-2px);
}

button:active {
  transform: translateY(2px);
}

.difficulty-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.difficulty-grid button {
  padding: 11px 5px;
  font-size: 12px;
  border: 2px solid white;
}

.difficulty-grid button.active {
  background: white;
  color: black;
}

#difficultyText {
  min-height: 25px;
  margin: 15px 0;
  color: #aaa;
  font-size: 14px;
}

.start-button {
  width: 100%;
  background: white;
  color: black;
  font-size: 18px;
  padding: 15px;
  margin-top: 4px;
}

.controls-preview {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.10);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1.5px;
  color: rgba(255, 255, 255, 0.65);
}

.controls-text {
  margin-top: 18px;
  color: rgba(255, 255, 255, 0.38);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
}

.direction-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: white;
  text-align: center;
}

.direction-text {
  font-size: clamp(35px, 7vw, 65px);
  font-weight: 900;
  letter-spacing: 8px;
}

#directionArrow {
  margin: 25px;
  font-size: clamp(80px, 15vw, 150px);
  line-height: 1;
  transform-origin: center;
  filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5)) drop-shadow(0 0 25px rgba(255, 255, 255, 0.25));
}

.direction-label {
  font-size: 15px;
  letter-spacing: 5px;
  color: #aaa;
}

.results {
  display: flex;
  justify-content: center;
  gap: 60px;
  margin-bottom: 25px;
}

.results div {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.results span {
  color: #999;
  font-size: 12px;
  letter-spacing: 2px;
}

.results strong {
  font-size: 45px;
}

#mobile-controls {
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
}

.slider-container {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 100px;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: auto;
}

#p1-container {
  left: 0;
}

#p2-container {
  right: 0;
}

.paddle-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 60vh;
  height: 24px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  outline: none;
  transform: rotate(90deg);
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
  margin: 0;
}

.paddle-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.4), inset 0 0 5px rgba(0, 0, 0, 0.2);
  cursor: pointer;
  transition: transform 0.1s ease;
}

.paddle-slider::-webkit-slider-thumb:active {
  transform: scale(1.15);
}

@media (hover: hover) and (pointer: fine) {
  #mobile-controls {
    display: none;
  }
}

@media (max-width: 650px) {
  #game-container {
    width: 100vw;
    height: 100vh;
    max-width: none;
    max-height: none;
    border-radius: 0;
    border-width: 0;
  }

  .card {
    padding: 28px 20px;
  }

  .button-grid {
    flex-direction: column;
  }

  .button-grid button {
    width: 100%;
  }

  .difficulty-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  #hud {
    top: 12px;
    gap: 20px;
  }

  .hud-box {
    padding: 8px 12px;
  }

  .hud-label {
    font-size: 8px;
  }

  .hud-value {
    font-size: 17px;
  }

  .paddle-slider::-webkit-slider-thumb {
    width: 55px;
    height: 55px;
  }

  .results {
    gap: 50px;
  }

  .results strong {
    font-size: 38px;
  }
}

@media (orientation: landscape) and (max-width: 900px) {
  .card {
    padding: 18px 25px;
  }

  .logo {
    font-size: 45px;
  }

  .subtitle {
    margin-bottom: 12px;
  }

  .section-title {
    margin: 10px 0 7px;
  }

  .controls-text {
    margin-top: 10px;
  }
}

/* ===== COINS & SHOP ===== */
#bankedCoinsMenu {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 10px 0 14px;
  padding: 9px 12px;
  border: 2px solid rgba(255, 255, 255, 0.42);
  border-radius: 14px;
  background: rgba(8, 8, 8, 0.62);
  font-family: monospace;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 1px;
}

.bank-coin {
  display: inline-flex;
  width: 20px;
  height: 20px;
  align-items: center;
  justify-content: center;
  border: 2px solid #ffd700;
  border-radius: 50%;
  font-size: 10px;
  color: #ffd700;
}

#skinShopScreen {
  z-index: 30;
  padding: 14px;
}

.skin-shop-card {
  width: min(760px, 92%);
  max-height: 82vh;
  overflow-y: auto;
  padding: 22px;
  display: flex;
  flex-direction: column;
}

.skin-shop-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.skin-shop-title {
  font-family: monospace;
  font-size: clamp(24px, 5vw, 40px);
  font-weight: 900;
  letter-spacing: 5px;
}

.shop-coins {
  border: 2px solid rgba(255, 255, 255, 0.5);
  border-radius: 12px;
  padding: 8px 12px;
  font-family: monospace;
  font-weight: 900;
  white-space: nowrap;
}

.shop-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-shrink: 0;
}

.shop-tabs button {
  flex: 1;
  padding: 10px;
  font-size: 12px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
}

.shop-tabs button.active {
  border-color: white;
  background: white;
  color: black;
}

.skin-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding: 2px 4px 8px 2px;
  flex: 1;
}

.skin-item {
  border: 2px solid rgba(255, 255, 255, 0.35);
  border-radius: 16px;
  padding: 10px;
  background: linear-gradient(145deg, rgba(40, 40, 40, 0.9), rgba(12, 12, 12, 0.95));
  text-align: center;
}

.skin-item.active {
  border-color: #ffd700;
  box-shadow: 0 0 18px rgba(255, 215, 0, 0.3);
}

.skin-preview {
  width: 100px;
  height: 100px;
  margin: 2px auto 8px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  background: #080808;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 50px;
  font-weight: 900;
}

.skin-name {
  font-weight: 900;
  font-size: 12px;
  letter-spacing: 1px;
}

.skin-price {
  margin: 5px 0 9px;
  color: #aaa;
  font-size: 11px;
}

.skin-btn {
  width: 100%;
  padding: 9px 8px;
  font-size: 11px;
}

.skin-btn:disabled {
  opacity: 0.55;
  cursor: default;
}

.shop-close-btn {
  margin-top: 10px;
  width: 100%;
  flex-shrink: 0;
}

#shopButton {
  width: 100%;
  margin-top: 8px;
}

@media (max-width: 650px) {
  #skinShopScreen {
    padding: 8px;
  }

  .skin-shop-card {
    width: 96%;
    max-height: 88vh;
    padding: 16px;
  }

  .skin-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .skin-preview {
    width: 80px;
    height: 80px;
    font-size: 40px;
  }

  .shop-coins {
    font-size: 12px;
    padding: 7px 9px;
  }

  .shop-tabs {
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>
<div id="game-container">
  <canvas id="gameCanvas" width="1200" height="700"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-box">
      <span class="hud-label">PLAYER 1</span>
      <span class="hud-value" id="score1">0</span>
    </div>
    <div class="hud-box">
      <span class="hud-label">PLAYER 2</span>
      <span class="hud-value" id="score2">0</span>
    </div>
  </div>

  <div id="menu" class="screen">
    <div class="card">
      <div class="logo">◇ PONG ◇</div>
      <div class="subtitle">Classic arcade • modern edition</div>

      <div id="mode-section">
        <div class="section-title">GAME MODE</div>
        <div class="button-grid">
          <button id="onePlayer">1 PLAYER</button>
          <button id="twoPlayers" class="active">2 PLAYERS</button>
        </div>
        <div class="controls-preview">
          <span id="controlsLabel">KEYBOARD OR ON-SCREEN CONTROLS</span>
        </div>

        <div id="bankedCoinsMenu">
          <span class="bank-coin">◆</span>
          <span id="bankedCoinsValue">0</span>
          <span style="color:#888;font-size:10px;letter-spacing:2px;">TOTAL COINS</span>
        </div>

        <button id="shopButton">🛒 SKIN SHOP</button>
      </div>

      <div id="difficulty-section" class="hidden">
        <div class="section-title">DIFFICULTY</div>
        <div class="difficulty-grid">
          <button data-difficulty="1">EASY</button>
          <button data-difficulty="2" class="active">NORMAL</button>
          <button data-difficulty="3">HARD</button>
          <button data-difficulty="4">INSANE</button>
        </div>
        <div id="difficultyText">Balanced acceleration and reactive bot</div>
        <button id="startButton" class="start-button">▶ START GAME</button>
        <button id="backButton">BACK</button>
      </div>

      <div class="controls-text">P1: W / S &nbsp; • &nbsp; P2: ↑ / ↓</div>
    </div>
  </div>

  <div id="skinShopScreen" class="screen hidden">
    <div class="card skin-shop-card">
      <div class="skin-shop-header">
        <div class="skin-shop-title">SHOP</div>
        <div class="shop-coins"><span class="bank-coin">◆</span> <span id="shopCoinsValue">0</span></div>
      </div>
      
      <div class="shop-tabs">
        <button id="ballTabBtn" class="active">BOLAS</button>
        <button id="paddleTabBtn">PALAS</button>
      </div>

      <div id="ballGrid" class="skin-grid"></div>
      <div id="paddleGrid" class="skin-grid hidden"></div>
      
      <button id="closeShopBtn" class="shop-close-btn">BACK TO MENU</button>
    </div>
  </div>

  <div id="directionScreen" class="screen hidden">
    <div class="card">
      <div class="direction-card">
        <div class="direction-text">READY</div>
        <div id="directionArrow">➤</div>
        <div class="direction-label">BALL DIRECTION</div>
      </div>
    </div>
  </div>

  <div id="gameOver" class="screen hidden">
    <div class="card">
      <h2 id="winner">PLAYER 1 WINS</h2>
      <div class="results">
        <div><span>PLAYER 1</span><strong id="final1">0</strong></div>
        <div><span>PLAYER 2</span><strong id="final2">0</strong></div>
      </div>
      <button id="againButton">↻ PLAY AGAIN</button>
      <button id="menuButton">MENU</button>
    </div>
  </div>

  <div id="mobile-controls">
    <div id="p1-container" class="slider-container">
      <input type="range" id="p1-slider" class="paddle-slider" min="0" max="1000" value="500">
    </div>
    <div id="p2-container" class="slider-container">
      <input type="range" id="p2-slider" class="paddle-slider" min="0" max="1000" value="500">
    </div>
  </div>
</div>

<script>
"use strict";

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;

const menu = document.getElementById("menu");
const skinShopScreen = document.getElementById("skinShopScreen");
const directionScreen = document.getElementById("directionScreen");
const gameOver = document.getElementById("gameOver");
const hud = document.getElementById("hud");
const modeSection = document.getElementById("mode-section");
const difficultySection = document.getElementById("difficulty-section");

const score1 = document.getElementById("score1");
const score2 = document.getElementById("score2");
const final1 = document.getElementById("final1");
const final2 = document.getElementById("final2");
const winner = document.getElementById("winner");
const difficultyText = document.getElementById("difficultyText");
const directionArrow = document.getElementById("directionArrow");

const p1Slider = document.getElementById("p1-slider");
const p2Slider = document.getElementById("p2-slider");

const bankedCoinsValue = document.getElementById("bankedCoinsValue");
const shopCoinsValue = document.getElementById("shopCoinsValue");
const ballGrid = document.getElementById("ballGrid");
const paddleGrid = document.getElementById("paddleGrid");

const BALL_SKINS = [
  { id: "classic", name: "CLASSIC", cost: 0, emoji: "⚪" },
  { id: "gold", name: "GOLD COIN", cost: 100, emoji: "🪙" },
  { id: "diamond", name: "DIAMOND", cost: 200, emoji: "💎" },
  { id: "fire", name: "FIRE BALL", cost: 150, emoji: "🔥" },
  { id: "star", name: "STAR", cost: 180, emoji: "⭐" },
  { id: "crystal", name: "CRYSTAL", cost: 250, emoji: "🔮" }
];

const PADDLE_SKINS = [
  { id: "classic", name: "CLASSIC", cost: 0, colors: { main: "#fff", glow: "#ffffff" } },
  { id: "gold", name: "GOLD", cost: 120, colors: { main: "#ffd700", glow: "#ffed4e" } },
  { id: "neon", name: "NEON CYAN", cost: 150, colors: { main: "#00ffff", glow: "#00ffff" } },
  { id: "ruby", name: "RUBY", cost: 180, colors: { main: "#ff1744", glow: "#ff5e7b" } },
  { id: "emerald", name: "EMERALD", cost: 180, colors: { main: "#00e676", glow: "#69f0ae" } },
  { id: "amethyst", name: "AMETHYST", cost: 200, colors: { main: "#d946ef", glow: "#f0abfc" } }
];

const settings = {
  1: { startSpeed: 300, maxSpeed: 560, acceleration: 0.32, playerSpeed: 720, botSpeed: 190, reaction: 0.28, deadZone: 38, pointMult: 10 },
  2: { startSpeed: 350, maxSpeed: 680, acceleration: 0.34, playerSpeed: 730, botSpeed: 330, reaction: 0.16, deadZone: 25, pointMult: 20 },
  3: { startSpeed: 390, maxSpeed: 800, acceleration: 0.38, playerSpeed: 750, botSpeed: 410, reaction: 0.08, deadZone: 13, pointMult: 35 },
  4: { startSpeed: 420, maxSpeed: 880, acceleration: 0.42, playerSpeed: 790, botSpeed: 550, reaction: 0.035, deadZone: 5, pointMult: 60 }
};

let difficulty = 2, mode = 2, running = false, selectingDirection = false;
let directionStart = 0, lastTime = 0, animationFrame = 0, bounces = 0, botReactionTimer = 0, botDirection = 0;
const keys = {};
let p1Dragging = false, p2Dragging = false;

const player1 = { x: 55, y: H / 2 - 75, width: 22, height: 150, speed: 730, score: 0 };
const player2 = { x: W - 77, y: H / 2 - 75, width: 22, height: 150, speed: 570, score: 0 };
const ball = { x: W / 2, y: H / 2, radius: 15, angle: 0, speed: 350 };

// Save system
const SAVE_KEY = "pongArcadeSave_v1";
let save = {
  coins: 0,
  owned_balls: ["classic"],
  owned_paddles: ["classic"],
  equipped_ball: "classic",
  equipped_paddle: "classic"
};

function loadSave() {
  try {
    const stored = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (stored && typeof stored === "object") {
      save = {
        coins: Math.max(0, Number(stored.coins) || 0),
        owned_balls: Array.isArray(stored.owned_balls) ? [...new Set(stored.owned_balls)] : ["classic"],
        owned_paddles: Array.isArray(stored.owned_paddles) ? [...new Set(stored.owned_paddles)] : ["classic"],
        equipped_ball: typeof stored.equipped_ball === "string" ? stored.equipped_ball : "classic",
        equipped_paddle: typeof stored.equipped_paddle === "string" ? stored.equipped_paddle : "classic"
      };
      if (!save.owned_balls.includes("classic")) save.owned_balls.unshift("classic");
      if (!save.owned_paddles.includes("classic")) save.owned_paddles.unshift("classic");
      if (!BALL_SKINS.some(s => s.id === save.equipped_ball) || !save.owned_balls.includes(save.equipped_ball)) save.equipped_ball = "classic";
      if (!PADDLE_SKINS.some(s => s.id === save.equipped_paddle) || !save.owned_paddles.includes(save.equipped_paddle)) save.equipped_paddle = "classic";
    }
  } catch (_) {}
  updateCoinDisplays();
}

function savePersist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {}
  updateCoinDisplays();
}

function updateCoinDisplays() {
  bankedCoinsValue.textContent = String(save.coins);
  shopCoinsValue.textContent = String(save.coins);
}

function addCoins(amount) {
  amount = Math.max(0, Math.floor(Number(amount) || 0));
  if (!amount) return;
  save.coins += amount;
  savePersist();
}

function openShop() {
  running = false;
  menu.classList.add("hidden");
  skinShopScreen.classList.remove("hidden");
  renderShop();
}

function closeShop() {
  skinShopScreen.classList.add("hidden");
  menu.classList.remove("hidden");
}

function renderShop() {
  ballGrid.innerHTML = "";
  for (const skin of BALL_SKINS) {
    const item = document.createElement("div");
    item.className = "skin-item" + (save.equipped_ball === skin.id ? " active" : "");

    const preview = document.createElement("div");
    preview.className = "skin-preview";
    preview.textContent = skin.emoji;

    const name = document.createElement("div");
    name.className = "skin-name";
    name.textContent = skin.name;

    const price = document.createElement("div");
    price.className = "skin-price";
    price.textContent = skin.cost === 0 ? "FREE" : `${skin.cost} ◆`;

    const btn = document.createElement("button");
    btn.className = "skin-btn";
    const owned = save.owned_balls.includes(skin.id);
    if (save.equipped_ball === skin.id) {
      btn.textContent = "EQUIPPED";
      btn.disabled = true;
    } else if (owned) {
      btn.textContent = "EQUIP";
    } else {
      btn.textContent = `BUY`;
    }

    btn.addEventListener("click", () => {
      if (!owned) {
        if (save.coins < skin.cost) return;
        save.coins -= skin.cost;
        save.owned_balls.push(skin.id);
      }
      save.equipped_ball = skin.id;
      savePersist();
      renderShop();
    });

    item.appendChild(preview);
    item.appendChild(name);
    item.appendChild(price);
    item.appendChild(btn);
    ballGrid.appendChild(item);
  }

  paddleGrid.innerHTML = "";
  for (const skin of PADDLE_SKINS) {
    const item = document.createElement("div");
    item.className = "skin-item" + (save.equipped_paddle === skin.id ? " active" : "");

    const preview = document.createElement("div");
    preview.className = "skin-preview";
    preview.style.background = `linear-gradient(135deg, ${skin.colors.main}, rgba(255,255,255,0.2))`;
    preview.style.boxShadow = `inset 0 0 20px ${skin.colors.glow}`;
    preview.textContent = "█";
    preview.style.fontSize = "60px";
    preview.style.color = skin.colors.main;
    preview.style.textShadow = `0 0 10px ${skin.colors.glow}`;

    const name = document.createElement("div");
    name.className = "skin-name";
    name.textContent = skin.name;

    const price = document.createElement("div");
    price.className = "skin-price";
    price.textContent = skin.cost === 0 ? "FREE" : `${skin.cost} ◆`;

    const btn = document.createElement("button");
    btn.className = "skin-btn";
    const owned = save.owned_paddles.includes(skin.id);
    if (save.equipped_paddle === skin.id) {
      btn.textContent = "EQUIPPED";
      btn.disabled = true;
    } else if (owned) {
      btn.textContent = "EQUIP";
    } else {
      btn.textContent = `BUY`;
    }

    btn.addEventListener("click", () => {
      if (!owned) {
        if (save.coins < skin.cost) return;
        save.coins -= skin.cost;
        save.owned_paddles.push(skin.id);
      }
      save.equipped_paddle = skin.id;
      savePersist();
      renderShop();
    });

    item.appendChild(preview);
    item.appendChild(name);
    item.appendChild(price);
    item.appendChild(btn);
    paddleGrid.appendChild(item);
  }

  updateCoinDisplays();
}

loadSave();

p1Slider.addEventListener("pointerdown", () => p1Dragging = true);
p1Slider.addEventListener("pointerup", () => p1Dragging = false);
p1Slider.addEventListener("pointercancel", () => p1Dragging = false);

p2Slider.addEventListener("pointerdown", () => p2Dragging = true);
p2Slider.addEventListener("pointerup", () => p2Dragging = false);
p2Slider.addEventListener("pointercancel", () => p2Dragging = false);

window.addEventListener("pointerup", () => { p1Dragging = false; p2Dragging = false; });

function randomAngle() {
  let a;
  do { a = Math.random() * Math.PI * 2; } while (Math.abs(Math.sin(a)) < 0.25);
  return a;
}

function resetRound(direction = null) {
  const c = settings[difficulty];
  ball.x = W / 2;
  ball.y = H / 2;
  ball.speed = c.startSpeed;
  bounces = 0;
  botReactionTimer = 0;
  botDirection = 0;
  if (direction === 1) ball.angle = Math.random() * 0.9 - 0.45;
  else if (direction === -1) ball.angle = Math.PI + (Math.random() * 0.9 - 0.45);
  else ball.angle = randomAngle();
  player1.y = H / 2 - player1.height / 2;
  player2.y = H / 2 - player2.height / 2;
  player1.speed = c.playerSpeed;
  player2.speed = c.botSpeed;
  updateScore();
}

function updateScore() {
  score1.textContent = player1.score;
  score2.textContent = player2.score;
}

function movePlayer(p, d, dt) {
  p.y += d * p.speed * dt;
  p.y = Math.max(0, Math.min(H - p.height, p.y));
}

function updatePlayer1(dt) {
  if (p1Dragging) {
    player1.y = (p1Slider.value / 1000) * (H - player1.height);
  } else {
    let d = 0;
    if (keys.w) d--;
    if (keys.s) d++;
    movePlayer(player1, d, dt);
    p1Slider.value = (player1.y / (H - player1.height)) * 1000;
  }
}

function updatePlayer2(dt) {
  if (mode === 1) {
    updateBot(dt);
    p2Slider.value = (player2.y / (H - player2.height)) * 1000;
    return;
  }
  if (p2Dragging) {
    player2.y = (p2Slider.value / 1000) * (H - player2.height);
  } else {
    let d = 0;
    if (keys.arrowup) d--;
    if (keys.arrowdown) d++;
    movePlayer(player2, d, dt);
    p2Slider.value = (player2.y / (H - player2.height)) * 1000;
  }
}

function updateBot(dt) {
  const c = settings[difficulty];
  const coming = Math.cos(ball.angle) > 0;
  if (!coming) {
    const diff = H / 2 - (player2.y + player2.height / 2);
    botDirection = Math.abs(diff) > 8 ? Math.sign(diff) : 0;
    movePlayer({ get y() { return player2.y; }, set y(v) { player2.y = v; }, speed: c.botSpeed, height: player2.height }, botDirection, 0.35 * dt);
    return;
  }
  botReactionTimer -= dt;
  if (botReactionTimer > 0) {
    player2.y += botDirection * c.botSpeed * dt;
    player2.y = Math.max(0, Math.min(H - player2.height, player2.y));
    return;
  }
  botReactionTimer = c.reaction;
  const diff = ball.y - (player2.y + player2.height / 2);
  botDirection = Math.abs(diff) <= c.deadZone ? 0 : Math.sign(diff);
  player2.y += botDirection * c.botSpeed * dt;
  player2.y = Math.max(0, Math.min(H - player2.height, player2.y));
}

function increaseSpeed() {
  const c = settings[difficulty];
  bounces++;
  const growth = 1 - Math.exp(-c.acceleration * bounces);
  ball.speed = c.startSpeed + (c.maxSpeed - c.startSpeed) * growth;
}

function collide(p, left) {
  const cx = Math.max(p.x, Math.min(ball.x, p.x + p.width));
  const cy = Math.max(p.y, Math.min(ball.y, p.y + p.height));
  const dx = ball.x - cx;
  const dy = ball.y - cy;
  if (dx * dx + dy * dy > ball.radius * ball.radius) return;
  const vx = Math.cos(ball.angle);
  const toward = left ? vx < 0 : vx > 0;
  if (!toward) return;
  const rel = Math.max(-1, Math.min(1, (ball.y - (p.y + p.height / 2)) / (p.height / 2)));
  increaseSpeed();
  const bounce = rel * Math.PI / 3;
  ball.angle = left ? bounce : Math.PI - bounce;
  ball.x = left ? p.x + p.width + ball.radius + 1 : p.x - ball.radius - 1;
  botReactionTimer = 0;
}

function updateBall(dt) {
  ball.x += Math.cos(ball.angle) * ball.speed * dt;
  ball.y += Math.sin(ball.angle) * ball.speed * dt;
  if (ball.y - ball.radius <= 0) {
    ball.y = ball.radius;
    ball.angle = -ball.angle;
    increaseSpeed();
  }
  if (ball.y + ball.radius >= H) {
    ball.y = H - ball.radius;
    ball.angle = -ball.angle;
    increaseSpeed();
  }
  collide(player1, true);
  collide(player2, false);
  if (ball.x + ball.radius < 0) {
    player2.score++;
    updateScore();
    addCoins(settings[difficulty].pointMult);
    if (player2.score >= 7) return finishGame(mode === 1 ? "BOT WINS" : "PLAYER 2 WINS");
    prepareNextRound(1);
  }
  if (ball.x - ball.radius > W) {
    player1.score++;
    updateScore();
    if (mode === 2) addCoins(settings[difficulty].pointMult);
    if (player1.score >= 7) return finishGame("PLAYER 1 WINS");
    prepareNextRound(-1);
  }
}

function prepareNextRound(dir) {
  running = false;
  selectingDirection = true;
  resetRound(dir);
  directionStart = performance.now();
  directionScreen.classList.remove("hidden");
  animationFrame = requestAnimationFrame(directionLoop);
}

function startRound() {
  player1.score = 0;
  player2.score = 0;
  updateScore();
  menu.classList.add("hidden");
  gameOver.classList.add("hidden");
  directionScreen.classList.remove("hidden");
  hud.classList.remove("hidden");
  selectingDirection = true;
  running = false;
  resetRound();
  directionStart = performance.now();
  cancelAnimationFrame(animationFrame);
  animationFrame = requestAnimationFrame(directionLoop);
}

function finishGame(text) {
  running = false;
  selectingDirection = false;
  hud.classList.add("hidden");
  winner.textContent = text;
  final1.textContent = player1.score;
  final2.textContent = player2.score;
  gameOver.classList.remove("hidden");
}

function directionLoop(time) {
  if (!selectingDirection) return;
  const progress = Math.min((time - directionStart) / 1800, 1);
  const eased = 1 - Math.pow(1 - progress, 3);
  const angle = ball.angle - Math.PI * 2 + Math.PI * 2 * eased;
  directionArrow.style.transform = `rotate(${angle}rad)`;
  draw();
  if (progress < 1) animationFrame = requestAnimationFrame(directionLoop);
  else {
    directionArrow.style.transform = `rotate(${ball.angle}rad)`;
    selectingDirection = false;
    directionScreen.classList.add("hidden");
    running = true;
    lastTime = performance.now();
    animationFrame = requestAnimationFrame(gameLoop);
  }
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#111820");
  g.addColorStop(0.5, "#080d14");
  g.addColorStop(1, "#03060a");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,.025)";
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 60) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += 60) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

function drawCenter() {
  ctx.fillStyle = "rgba(255,255,255,.2)";
  for (let y = 20; y < H; y += 40) ctx.fillRect(W / 2 - 2, y, 4, 22);
}

function getPaddleSkin() {
  return PADDLE_SKINS.find(s => s.id === save.equipped_paddle) || PADDLE_SKINS[0];
}

function drawPaddle(p) {
  const skin = getPaddleSkin();
  const g = ctx.createLinearGradient(p.x, 0, p.x + p.width, 0);
  g.addColorStop(0, skin.colors.main);
  g.addColorStop(0.5, skin.colors.main);
  g.addColorStop(1, "rgba(255,255,255,0.6)");
  ctx.fillStyle = g;
  ctx.shadowColor = skin.colors.glow;
  ctx.shadowBlur = 25;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
  ctx.beginPath();
  ctx.roundRect(p.x, p.y, p.width, p.height, 9);
  ctx.fill();
  
  // Inner highlight
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.beginPath();
  ctx.roundRect(p.x + 2, p.y + 2, p.width - 4, p.height / 2 - 2, 6);
  ctx.fill();
}

function getBallSkin() {
  return BALL_SKINS.find(s => s.id === save.equipped_ball) || BALL_SKINS[0];
}

function drawBall() {
  const skin = getBallSkin();
  ctx.save();
  
  // Glow
  ctx.shadowColor = "rgba(255,255,255,.8)";
  ctx.shadowBlur = 22;
  
  // Pelota con emoji
  ctx.font = `${ball.radius * 2}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(skin.emoji, ball.x, ball.y);
  
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawCenter();
  drawPaddle(player1);
  drawPaddle(player2);
  drawBall();
}

function gameLoop(time) {
  if (!running) {
    draw();
    return;
  }
  let dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  updatePlayer1(dt);
  updatePlayer2(dt);
  updateBall(dt);
  draw();
  animationFrame = requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  if ([" ", "ArrowUp", "ArrowDown"].includes(e.key)) e.preventDefault();
});

document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

document.getElementById("onePlayer").onclick = () => {
  mode = 1;
  modeSection.classList.add("hidden");
  difficultySection.classList.remove("hidden");
};

document.getElementById("twoPlayers").onclick = () => {
  mode = 2;
  modeSection.classList.add("hidden");
  difficultySection.classList.remove("hidden");
};

document.getElementById("shopButton").onclick = openShop;
document.getElementById("closeShopBtn").onclick = closeShop;

document.getElementById("ballTabBtn").onclick = () => {
  document.getElementById("ballTabBtn").classList.add("active");
  document.getElementById("paddleTabBtn").classList.remove("active");
  ballGrid.classList.remove("hidden");
  paddleGrid.classList.add("hidden");
};

document.getElementById("paddleTabBtn").onclick = () => {
  document.getElementById("paddleTabBtn").classList.add("active");
  document.getElementById("ballTabBtn").classList.remove("active");
  paddleGrid.classList.remove("hidden");
  ballGrid.classList.add("hidden");
};

document.querySelectorAll("[data-difficulty]").forEach(b => b.onclick = () => {
  difficulty = Number(b.dataset.difficulty);
  document.querySelectorAll("[data-difficulty]").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  difficultyText.textContent = {
    1: "Slow and forgiving bot · 10 coins/goal",
    2: "Balanced acceleration and reactive bot · 20 coins/goal",
    3: "Fast acceleration and fast bot · 35 coins/goal",
    4: "Extreme speed and extremely fast bot · 60 coins/goal"
  }[difficulty];
});

document.getElementById("startButton").onclick = startRound;
document.getElementById("againButton").onclick = startRound;
document.getElementById("backButton").onclick = () => {
  difficultySection.classList.add("hidden");
  modeSection.classList.remove("hidden");
};
document.getElementById("menuButton").onclick = () => {
  running = false;
  selectingDirection = false;
  menu.classList.remove("hidden");
  modeSection.classList.remove("hidden");
  difficultySection.classList.add("hidden");
  gameOver.classList.add("hidden");
  directionScreen.classList.add("hidden");
  hud.classList.add("hidden");
};

resetRound();
draw();
</script>
